<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>티츄 기보</title>
<!-- ?v=는 sw.js의 V와 함께 올린다 (CF Browser Cache TTL 우회 — sw.js 머리주석 참조) -->
<link rel="stylesheet" href="style.css?v=37">
<style>
/* 기보 뷰어 전용 — style.css의 카드·버튼·배경을 그대로 쓰고 화면 골격만 정의 */
html { background: #0e2c1f; } /* 스크롤 페이지 — 문서 밖 영역도 배경색 유지 (게임 앱은 100dvh 고정이라 불필요했음) */
html, body { height: auto; min-height: 100%; }
#rv { min-height: 100dvh; max-width: 760px; margin: 0 auto; padding: 10px 10px calc(14px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }
.rvTop { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rvTop h1 { font-size: 18px; margin-right: auto; }
.rvSrc { background: rgba(255,255,255,.1); color: #f0ece2; border: 1px solid rgba(255,255,255,.2); border-radius: 10px; padding: 6px 8px; font-size: 13px; max-width: 46vw; }
.rvNote { font-size: 12.5px; opacity: .75; line-height: 1.5; }
.rvList { display: flex; flex-direction: column; gap: 6px; }
.rvItem { text-align: left; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 8px 12px; color: #f0ece2; display: block; width: 100%; }
.rvItem:active { transform: scale(.99); }
.rvItem .l1 { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 13px; }
.rvItem .l1 b { font-size: 14.5px; }
.rvItem .l2 { font-size: 12.5px; opacity: .8; margin-top: 2px; }
.rvBadge { font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 8px; background: rgba(255,255,255,.14); }
.rvBadge.a { background: #2a62c4; }
.rvBadge.b { background: #b3402f; }
.rvBadge.gold { background: #ffd34d; color: #2b2412; }
.rvSeat { background: rgba(0,0,0,.18); border-radius: 12px; padding: 6px 8px 8px; border: 1px solid transparent; }
.rvSeat.act { border-color: #ffd34d; box-shadow: 0 0 0 1px #ffd34d inset; }
.rvSeat .hd { display: flex; align-items: center; gap: 6px; font-size: 13px; margin-bottom: 5px; flex-wrap: wrap; }
.rvSeat .hd b { font-size: 14px; }
.rvHand { display: flex; padding-left: 2px; min-height: 59px; align-items: flex-start; }
.rvHand .card { margin-left: -24px; }
.rvHand .card:first-child { margin-left: 0; }
.rvTrick { background: rgba(0,0,0,.25); border-radius: 12px; padding: 8px 10px; min-height: 84px; }
.rvTrick .tHd { font-size: 12.5px; opacity: .85; margin-bottom: 6px; display: flex; gap: 10px; flex-wrap: wrap; }
.rvPlay { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.rvPlay .who { font-size: 12px; width: 52px; flex: none; opacity: .9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rvPlay .cs { display: flex; }
.rvPlay .cs .card { margin-left: -22px; }
.rvPlay .cs .card:first-child { margin-left: 0; }
.rvCtl { display: flex; align-items: center; gap: 6px; }
.rvCtl input[type=range] { flex: 1; min-width: 60px; }
.rvStep { font-size: 12.5px; opacity: .85; min-width: 64px; text-align: center; }
.rvLog { background: rgba(0,0,0,.18); border-radius: 12px; padding: 6px 4px; max-height: 180px; overflow-y: auto; font-size: 13px; position: relative; }
.rvLog .ln { padding: 3px 10px; border-radius: 8px; display: flex; gap: 8px; cursor: pointer; }
.rvLog .ln .n { opacity: .5; min-width: 26px; text-align: right; flex: none; }
.rvLog .ln.cur { background: rgba(255,211,77,.22); }
.rvSum { background: rgba(0,0,0,.25); border-radius: 12px; padding: 10px 12px; font-size: 14px; line-height: 1.7; }
.rvErr { background: rgba(179,64,47,.35); border: 1px solid #b3402f; border-radius: 12px; padding: 8px 12px; font-size: 13px; }
.rvEmpty { opacity: .7; font-size: 14px; padding: 20px 4px; text-align: center; }
</style>
</head>
<body>
<div id="rv"></div>
<script src="shared/tichu-core.js?v=37"></script>
<script src="replay.js?v=37"></script>
</body>
</html>
